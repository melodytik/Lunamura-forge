# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
-Dfile.encoding=UTF-8

bukkit_version=997de31d
craftbukkit_version=ddc9a2dad
spigot_version=d2eba2c8
forge_version=47.4.22
neoforge_version=47.1.106
mohist_group_id=com.mohistmc

# 主人已在本机开启网络代理（clash 等），沙箱可经此访问外网。
# 启用后所有被 egress 拦截的源（阿里云/Central/forge 等）都能解析。
# 主人已在本机开启网络代理（clash 等），沙箱可经此访问外网。
# 启用后所有被 egress 拦截的源（阿里云/Central/forge 等）都能解析。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
#systemProp.socks.proxyHost=127.0.0.1
#systemProp.socks.proxyPort=7890

# Network resilience: maven.minecraftforge.net is flaky from some networks and
# can time out mid-build, causing "plugin not found" even though the artifact exists.
# Raise HTTP timeouts so a slow response doesn't abort plugin resolution.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# 让 ForgeGradle 的运行期下载（Minecraft / Forge 二进制、userdev）走 forge 原站。
# 之前用 BMCLAPI 会被其 302 重定向到教育网镜像(cernet)导致 TLS 握手失败，故改回原站（经代理可达）。
minecraftRepo=https://maven.minecraftforge.net/